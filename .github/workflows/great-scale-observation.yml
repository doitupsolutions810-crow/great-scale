name: Great Scale Observation Certificates

on:
  push:
    branches: [main, "feat/lxxx-observation-certificates"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run observation certificate tests
        run: PYTHONPATH=. python tests/test_observation.py -v

name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, "Great-Scale"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: python3 test_descent.py
      - run: python3 -m unittest -v test_robust_feasibility.py

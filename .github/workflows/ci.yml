name: Great Scale build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax build for browser and CommonJS modules
        run: npm run build
      - name: Great Scale Node regression suite
        run: npm test
      - name: Existing descent regression suite
        run: python3 test_descent.py
      - name: LVI fixed-moment and robust-bound regression suite
        run: python3 test_loss_envelope.py

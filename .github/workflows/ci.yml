name: CI
on:
  push:
    branches: [main, 'research/combined-verification-gate-2026-10-22']
  pull_request:
    branches: [main, 'research/kernel-hardening-4401-4500']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: great-scale-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the canonical verification script
        env:
          VERIFY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          VERIFY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: bash scripts/verify-local.sh
      - name: Upload commit-bound verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: great-scale-verification-receipt
          path: ${{ runner.temp }}/great-scale-verification-receipt.json
          if-no-files-found: warn
          retention-days: 14

name: Great Scale CXI Observer View Comparison
on:
  push:
    branches: ["feat/cx-observer-checkpoint-consistency"]
  pull_request:
    branches: [main]
jobs:
  cxi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: Test CX checkpoint and CXI observer comparison
        env:\n          PYTHONPATH: .\n        run: |\n          python tests/test_observer_checkpoint_consistency.py -v\n          python tests/test_observer_view_comparison.py -v

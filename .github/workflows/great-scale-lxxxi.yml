name: Great Scale LXXXI Bias-Floor Tests

on:
  push:
    branches: [main, "feat/lxxxi-bias-floor-stopping"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test adaptive stopping module
        run: PYTHONPATH=. python tests/test_adaptive_stopping.py -v

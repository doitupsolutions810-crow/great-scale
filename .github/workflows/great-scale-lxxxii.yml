name: Great Scale LXXXII
on:
  push:
    branches: [feat/lxxxii-calibration-validity]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_orientation test_observation tests.test_adaptive_stopping tests.test_calibration_validity
        env:
          PYTHONPATH: .

name: Great Scale CXVII Evidence Scope Identity
on:
  push:
    branches: ["feat/cx-observer-checkpoint-consistency"]
  pull_request:
    branches: [main]
jobs:
  cxvii-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence scope identity binding
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_evidence_scope_binding

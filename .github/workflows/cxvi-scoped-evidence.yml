name: Great Scale CXVI Scoped Evidence Certificate
on:
  push:
    branches: ["feat/cx-observer-checkpoint-consistency"]
  pull_request:
    branches: [main]
jobs:
  cxvi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test scoped evidence certificate
        env:
          PYTHONPATH: .
        run: python tests/test_scoped_evidence_certificate.py -v
